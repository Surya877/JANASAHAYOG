services:
  - type: web
    name: jansahyog
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: MONGO_DB_NAME
        value: jansahyog
      - key: JWT_SECRET
        generateValue: true
      - key: MONGO_URI
        sync: false
